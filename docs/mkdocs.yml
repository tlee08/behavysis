site_name: behavysis Documentation
site_url: https://tlee08.github.io/behavysis/
repo_url: https://github.com/tlee08/behavysis

theme:
  name: material
  features:
    - content.code.copy
    - toc.follow
    - navigation.indexes

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../]
          import:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://pytorch.org/docs/stable/objects.inv
          options:
            show_root_heading: true
            docstring_style: numpy
            # merge_init_into_class: true
            modernize_annotations: true
            signature_crossrefs: true
  - search
  - autorefs
  - offline
  - tags

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/install.md
  - How-to Guides:
      - how-to/open-field.md
      - how-to/social-interaction.md
      - how-to/troubleshoot.md
      - how-to/train-classifier.md
  - Reference:
      - reference/behavysis.md
      - reference/project.md
      - reference/experiment.md
      - reference/processes.md
      - reference/behav_classifier.md
      - reference/behav_classifier_templates.md
  - Explanation:
      - explanation/pipeline.md
      - explanation/config.md
