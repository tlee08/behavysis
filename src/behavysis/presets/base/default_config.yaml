# =============================================================================
# Behavysis Project Configuration — Reference
# =============================================================================
#
# Every field is REQUIRED but can be `null` if not using that stage.
# Underscore-prefixed keys (_*) define reusable YAML anchors — kept by parser,
# silently ignored by the config validator.
# =============================================================================

# ---- Anchors ----
_bpts_centre: &bpts_centre [BodyCentre, TailBase1]
_bpts_front: &bpts_front [Nose]
_bpts_corners: &bpts_corners [TopLeft, TopRight, BottomLeft, BottomRight]
_bpts_simba: &bpts_simba
  - Nose
  - LeftEar
  - RightEar
  - BodyCentre
  - LeftFlankMid
  - RightFlankMid
  - TailBase1
  - TailTip
_indivs_simba: &indivs_simba [mouse1marked, mouse2unmarked]

# ---- Format raw .mp4 to standard resolution/fps (stage 2) ----
format_video:
  width_px: 960
  height_px: 540
  fps: 15.0
  start_sec: null # trim from start, or null
  stop_sec: null # trim from end, or null

# ---- DeepLabCut keypoint tracking (stage 3) ----
run_dlc:
  model_fp: /absolute/path/to/DLC_model/config.yaml

# ---- Calculate auto-parameters from keypoints ----
calculate_parameters:
  start_frame_from_likelihood:
    bodyparts: *bpts_simba
    window_sec: 1.0
    pcutoff: 0.8
  stop_frame_from_dur:
    dur_sec: 600
  stop_frame_from_likelihood:
    bodyparts: *bpts_simba
    window_sec: 1.0
    pcutoff: 0.8
  dur_frames_from_likelihood:
    bodyparts: *bpts_simba
    window_sec: 1.0
    pcutoff: 0.8
  px_per_mm:
    pt_a: TopLeft
    pt_b: TopRight
    dist_mm: 400

# ---- Preprocess keypoints (stage 4) ----
preprocess:
  start_stop_trim: {}
  interpolate:
    pcutoff: 0.5
  interpolate_stationary: {}
  refine_ids: # only for two-animal experiments
    marked: mouse1marked
    unmarked: mouse2unmarked
    marking: AnimalColourMark
    window_sec: 0.5
    bodyparts: *bpts_centre

# ---- Extract features for behaviour classifier (stage 5) ----
extract_features:
  individuals: *indivs_simba
  bodyparts: *bpts_simba

# ---- Behaviour classification (stage 6) ----
classify_behaviour:
  - proj_dir: /absolute/path/to/training/project
    behaviour_name: example_behaviour
    pcutoff: 0.5
    min_empty_window_secs: 0.2
    user_defined: []

# ---- Quantitative analysis (stage 8) ----
analyse:
  bins_sec_ls: [30, 60, 120]
  custom_bins_sec_ls: [60, 120, 300, 600]
  speed:
    smoothing_sec: 1.0
    bodyparts: *bpts_centre
  distance:
    smoothing_sec: 1.0
    bodyparts: *bpts_centre
  freezing:
    window_sec: 2.0
    thresh_mm: 5.0
    bodyparts: *bpts_centre
  in_roi:
    - roi_name: in_centre
      is_in: true
      padding_mm: 0.0
      roi_corners: *bpts_corners
      bodyparts: *bpts_front
  social_distance:
    smoothing_sec: 1.0
    bodyparts: *bpts_centre
