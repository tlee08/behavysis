# =============================================================================
# Open Field — Single Mouse
# =============================================================================
#
# Standard open field test: one mouse, measures speed, freezing, distance,
# and thigmotaxis (in_roi).
#
# Edit the DLC model path and arena measurements, then run the notebook.
# =============================================================================

_bpts_centre:  &bpts_centre   [BodyCentre, TailBase1]
_bpts_front:   &bpts_front    [Nose]
_bpts_corners: &bpts_corners  [TopLeft, TopRight, BottomLeft, BottomRight]
_indivs_single: &indivs_single [single]

format_video:
  width_px: 960
  height_px: 540
  fps: 15.0
  start_sec: null
  stop_sec: null

run_dlc:
  model_fp: /absolute/path/to/DLC_model/config.yaml

calculate_parameters:
  start_frame_from_likelihood:
    bodyparts: [Nose, BodyCentre, TailBase1]
    window_sec: 1.0
    pcutoff: 0.8
  stop_frame_from_dur:
    dur_sec: 600
  dur_frames_from_likelihood:
    bodyparts: [Nose, BodyCentre, TailBase1]
    window_sec: 1.0
    pcutoff: 0.8
  px_per_mm:
    pt_a: TopLeft
    pt_b: TopRight
    dist_mm: 400

preprocess:
  start_stop_trim: {}
  interpolate:
    pcutoff: 0.5

extract_features: null

classify_behaviour: null

analyse:
  bins_sec_ls: [30, 60, 120]
  custom_bins_sec_ls: []
  speed:
    smoothing_sec: 1.0
    bodyparts: *bpts_centre
  distance:
    smoothing_sec: 1.0
    bodyparts: *bpts_centre
  freezing:
    window_sec: 2.0
    thresh_mm: 5.0
    bodyparts: *bpts_centre
  in_roi:
    - roi_name: in_centre
      is_in: true
      padding_mm: 0.0
      roi_corners: *bpts_corners
      bodyparts: *bpts_front
